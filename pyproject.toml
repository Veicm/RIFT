[project]
name = "rift"
version = "0.0.0"
description = "RIFT - Run Information & Fundraising Tracker"
authors = [{ name = "Veicm" }, { name = "Horst507" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1",
  "ruff>=0.16.9",
  "pre-commit>=4.6.2",
  "build>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rift"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rift*"]

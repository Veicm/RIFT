{% load static %}

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schüler registrieren | RIFT</title>
    <link rel="stylesheet" href="{% static '/style.css' %}">
</head>
<body>
    <header>
        <div class="header-content">
            <span class="eyebrow">RIFT · VERWALTUNG</span>
            <h1>Schüler registrieren</h1>
            <p>Persönliche Angaben und Spendensummen eintragen</p>
        </div>
    </header>

    <main>
        
        <form class="register-form" method="post">
            
            <section class="form-section register-personal-info" aria-labelledby="personal-info-title">
               {% csrf_token %}
                <div class="section-heading">
                    <span class="section-number" aria-hidden="true">01</span>
                    <div>
                        <h2 id="personal-info-title">Persönliche Angaben</h2>
                        <p>Wer wird registriert?</p>
                    </div>
                </div>
                <div class="field-grid">
                    <div class="form-field">
                        <label for="firstname">Vorname</label>
                        <input id="firstname" name="firstname" type="text" maxlength="15" placeholder="Max">
                    </div>
                    <div class="form-field">
                        <label for="lastname">Nachname</label>
                        <input id="lastname" name="lastname" type="text" maxlength="30" placeholder="Mustermann">
                    </div>
                </div>
            </section>

            <section class="form-section register-donation-info" aria-labelledby="donation-info-title">
                {% csrf_token %}
                <div class="section-heading">
                    <span class="section-number" aria-hidden="true">02</span>
                    <div>
                        <h2 id="donation-info-title">Spendensummen</h2>
                        <p>Beiträge pro Runde oder als fester Betrag</p>
                    </div>
                </div>
                <div class="field-grid">
                    <div class="form-field">
                        <label for="donation-per-round">Spendensumme pro Runde</label>
                        <div class="input-with-suffix">
                            <input id="donation-per-round" name="donation-per-round" type="number" placeholder="0,00" step="0.5" min="0">
                            <span aria-hidden="true">€</span>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="fixed-donation">Feste Spendensumme</label>
                        <div class="input-with-suffix">
                            <input id="fixed-donation" name="fixed-donation" type="number" placeholder="0,00" step="0.5" min="0">
                            <span aria-hidden="true">€</span>
                        </div>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" >Speichern</button>
            </div>


        </form>
    </main>
</body>
</html>
